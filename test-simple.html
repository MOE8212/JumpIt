<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JumpIt - Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.hidden {
            display: none;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            width: 100%;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div id="status">Status: Loading...</div>
    
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <h2>Benutzername eingeben</h2>
            <form id="auth-form">
                <input type="text" id="username" placeholder="Benutzername" required>
                <button type="submit">Loslegen!</button>
            </form>
        </div>
    </div>

    <script>
        console.log('Script started');
        
        // Status anzeigen
        function updateStatus(text) {
            document.getElementById('status').textContent = 'Status: ' + text;
            console.log('STATUS:', text);
        }
        
        updateStatus('Script loaded');
        
        // Warten bis DOM bereit ist
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('DOM ready');
            
            const authModal = document.getElementById('auth-modal');
            const authForm = document.getElementById('auth-form');
            const usernameInput = document.getElementById('username');
            
            console.log('authModal:', authModal);
            console.log('authForm:', authForm);
            console.log('usernameInput:', usernameInput);
            
            // Prüfe ob User bereits angemeldet ist
            const savedUser = localStorage.getItem('jumpit_user');
            
            if (savedUser) {
                const user = JSON.parse(savedUser);
                updateStatus('Angemeldet als: ' + user.username);
                authModal.classList.add('hidden');
                alert('Willkommen zurück, ' + user.username + '!\n\nDu bist bereits angemeldet.');
            } else {
                updateStatus('Nicht angemeldet - Formular wird angezeigt');
                authModal.classList.remove('hidden');
                setTimeout(() => usernameInput.focus(), 100);
            }
            
            // Formular absenden
            if (authForm) {
                authForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    console.log('Form submitted');
                    
                    const username = usernameInput.value.trim();
                    console.log('Username:', username);
                    
                    if (username) {
                        // User speichern
                        const user = {
                            id: Date.now(),
                            username: username,
                            email: username + '@offline.local'
                        };
                        
                        localStorage.setItem('jumpit_user', JSON.stringify(user));
                        console.log('User saved:', user);
                        
                        updateStatus('Angemeldet als: ' + username);
                        authModal.classList.add('hidden');
                        
                        alert('Willkommen, ' + username + '!\n\nDu bist jetzt angemeldet.\n\nBeim nächsten Besuch musst du dich nicht mehr anmelden.');
                    }
                });
            }
            
            updateStatus('Ready');
        });
    </script>
</body>
</html>
