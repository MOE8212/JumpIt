name: Deploy to GitHub Pages

# Trigger-Optionen:
# 1. Automatisch bei jedem Push auf main oder beta
# 2. Manuell über "Actions" → "Deploy to GitHub Pages" → "Run workflow"
on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch: # Ermöglicht manuelles Triggern

# Berechtigungen für GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job 1: Version aktualisieren (nur für main)
  update-version:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Vollständige Git-History
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Update Version Info
        run: |
          # Setup Node.js
          node --version
          
          # Run our existing update script (handles special characters properly)
          node update-version.js
          
          echo "✅ Version update completed"

      - name: 💾 Commit Updated Version (if changed)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet index.html; then
            echo "No changes to commit"
          else
            git add index.html
            git commit -m "🤖 Auto-update version info [skip ci]"
            git push
            echo "✅ Version committed and pushed"
          fi

  # Job 2: Deploy zu GitHub Pages
  deploy:
    runs-on: ubuntu-latest
    needs: update-version
    if: always() && (needs.update-version.result == 'success' || needs.update-version.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout Source Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: source

      - name: 📥 Checkout gh-pages Branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: 🔍 Determine Deploy Target
        id: deploy-target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=root" >> $GITHUB_OUTPUT
            echo "path=." >> $GITHUB_OUTPUT
            echo "url=https://jump-verse.com/" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "beta" ]; then
            echo "target=beta" >> $GITHUB_OUTPUT
            echo "path=beta" >> $GITHUB_OUTPUT
            echo "url=https://jump-verse.com/beta/" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Prepare Deployment Files
        run: |
          TARGET_PATH="gh-pages/${{ steps.deploy-target.outputs.path }}"
          
          # Erstelle Zielverzeichnis falls nicht vorhanden
          mkdir -p "$TARGET_PATH"
          
          # Lösche alte Dateien im Zielverzeichnis (außer .git)
          if [ "${{ steps.deploy-target.outputs.target }}" = "root" ]; then
            # Bei root: Lösche alles außer beta/ und .git
            cd gh-pages
            find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name 'beta' -exec rm -rf {} +
            cd ..
          else
            # Bei beta: Lösche nur beta/ Verzeichnis Inhalt
            rm -rf "$TARGET_PATH"/*
          fi
          
          # Kopiere neue Dateien
          cp -r source/* "$TARGET_PATH/"
          
          echo "✅ Files prepared for deployment to ${{ steps.deploy-target.outputs.target }}"

      - name: 🔍 Verify Deployment
        run: |
          echo "=== Deployment Structure ==="
          ls -la gh-pages/
          if [ "${{ steps.deploy-target.outputs.target }}" = "beta" ]; then
            echo "=== Beta Directory ==="
            ls -la gh-pages/beta/
          fi

      - name: 💾 Commit and Push to gh-pages
        run: |
          cd gh-pages
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          
          if git diff --quiet --cached; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy ${{ github.ref_name }} to ${{ steps.deploy-target.outputs.target }}"
            git push
            echo "✅ Deployed successfully!"
          fi

      - name: ✅ Deployment Success
        run: |
          echo "🎉 Successfully deployed ${{ github.ref_name }} to GitHub Pages!"
          echo "🔗 URL: ${{ steps.deploy-target.outputs.url }}"
