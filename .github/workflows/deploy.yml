name: Deploy to GitHub Pages

# Trigger-Optionen:
# 1. Automatisch bei jedem Push auf main
# 2. Manuell über "Actions" → "Deploy to GitHub Pages" → "Run workflow"
on:
  push:
    branches:
      - main
  workflow_dispatch: # Ermöglicht manuelles Triggern

# Berechtigungen für GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job 1: Version aktualisieren
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Vollständige Git-History
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Update Version Info
        run: |
          # Setup Node.js
          node --version
          
          # Run our existing update script (handles special characters properly)
          node update-version.js
          
          echo "✅ Version update completed"

      - name: 💾 Commit Updated Version (if changed)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet index.html; then
            echo "No changes to commit"
          else
            git add index.html
            git commit -m "🤖 Auto-update version info [skip ci]"
            git push
            echo "✅ Version committed and pushed"
          fi

  # Job 2: Deploy zu GitHub Pages
  deploy:
    runs-on: ubuntu-latest
    needs: update-version
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main # Holt die aktualisierte Version

      - name: 📦 Setup Pages
        uses: actions/configure-pages@v4

      - name: 🔍 Verify Files
        run: |
          echo "=== Checking deployment files ==="
          ls -la
          echo ""
          echo "=== Current version in index.html ==="
          grep "Build Info:" index.html || echo "Build info not found"
          grep "version-display" index.html || echo "Version display not found"

      - name: 📤 Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: ✅ Deployment Success
        run: |
          echo "🎉 Successfully deployed to GitHub Pages!"
          echo "🔗 URL: ${{ steps.deployment.outputs.page_url }}"
