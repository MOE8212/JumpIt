name: Deploy to GitHub Pages

# Trigger-Optionen:
# 1. Automatisch bei jedem Push auf main oder beta
# 2. Manuell über "Actions" → "Deploy to GitHub Pages" → "Run workflow"
on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch: # Ermöglicht manuelles Triggern

# Berechtigungen für GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job 1: Version aktualisieren (nur für main)
  update-version:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Vollständige Git-History
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Update Version Info
        run: |
          # Setup Node.js
          node --version
          
          # Run our existing update script (handles special characters properly)
          node update-version.js
          
          echo "✅ Version update completed"

      - name: 💾 Commit Updated Version (if changed)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet index.html; then
            echo "No changes to commit"
          else
            git add index.html
            git commit -m "🤖 Auto-update version info [skip ci]"
            git push
            echo "✅ Version committed and pushed"
          fi

  # Job 2: Deploy zu GitHub Pages  
  deploy:
    runs-on: ubuntu-latest
    needs: update-version
    if: always() && (needs.update-version.result == 'success' || needs.update-version.result == 'skipped')
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 📥 Checkout Current Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 📦 Build Deployment Directory
        run: |
          mkdir -p deploy
          
          # Download aktuellen gh-pages Stand (wenn vorhanden)
          echo "Fetching current gh-pages content..."
          git fetch origin gh-pages 2>/dev/null || echo "No gh-pages branch yet"
          
          # Versuche gh-pages Inhalt zu holen
          if git rev-parse origin/gh-pages >/dev/null 2>&1; then
            echo "Copying current gh-pages content..."
            git --work-tree=deploy checkout origin/gh-pages -- . 2>/dev/null || true
          fi
          
          # Jetzt Update basierend auf Branch
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "📦 Updating PRODUCTION (root)..."
            # Lösche alles außer beta/
            find deploy -mindepth 1 -maxdepth 1 ! -name 'beta' -exec rm -rf {} + 2>/dev/null || true
            # Kopiere neue Files
            find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name 'deploy' ! -name 'backend' ! -name 'node_modules' -exec cp -r {} deploy/ \;
            # Stelle sicher dass beta/ existiert
            mkdir -p deploy/beta
          elif [ "${{ github.ref_name }}" = "beta" ]; then
            echo "📦 Updating BETA (/beta/)..."
            # Lösche nur beta/ Inhalt
            rm -rf deploy/beta
            mkdir -p deploy/beta
            # Kopiere neue Files nach beta/
            find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name 'deploy' ! -name 'backend' ! -name 'node_modules' -exec cp -r {} deploy/beta/ \;
          fi
          
          # Cleanup
          rm -rf deploy/.git 2>/dev/null || true
          rm -rf deploy/.github 2>/dev/null || true
          rm -rf deploy/deploy 2>/dev/null || true
          
          echo "✅ Deployment directory prepared"

      - name: 🔍 Verify Deployment Structure
        run: |
          echo "=== Deploy Root Files ==="
          ls -la deploy/ | head -20
          if [ -d "deploy/beta" ]; then
            echo "=== Beta Directory ==="
            ls -la deploy/beta/ | head -10
          fi

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: ✅ Deployment Success
        run: |
          echo "🎉 Successfully deployed ${{ github.ref_name }} to GitHub Pages!"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "🔗 URL: https://jump-verse.com/"
          else
            echo "🔗 URL: https://jump-verse.com/beta/"
          fi
