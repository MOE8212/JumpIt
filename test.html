<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JumpIt Test - Home Screen</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
        }
        
        .home-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #1a1a1a 0%, #2d1810 25%, #4a2c17 50%, #8b4513 75%, #daa520 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .home-content {
            text-align: center;
        }
        
        .game-title {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ff6b6b;
        }
        
        .game-subtitle {
            font-size: 2rem;
            margin-bottom: 40px;
            color: #ff6b6b;
        }
        
        .home-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        
        .play-button, .home-shop-button {
            background: linear-gradient(135deg, #8b0000 0%, #ff0000 50%, #8b0000 100%);
            border: 3px solid #ff6b6b;
            border-radius: 50px;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .home-shop-button {
            background: linear-gradient(135deg, #4a2c17 0%, #8b4513 50%, #daa520 100%);
            border-color: #ffd700;
            font-size: 1.2rem;
            padding: 15px 40px;
        }
        
        .play-button:hover, .home-shop-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="home-screen">
        <div class="home-content">
            <h1 class="game-title">🎮 JumpIt</h1>
            <p class="game-subtitle">Das ultimative Jump 'n Run Abenteuer!</p>
            <div class="home-buttons">
                <button class="play-button" onclick="alert('Spiel würde starten!')">
                    ▶ Spielen
                </button>
                <button class="home-shop-button" onclick="alert('Shop würde öffnen!')">
                    🛒 Shop
                </button>
            </div>
        </div>
    </div>
</body>
</html>
